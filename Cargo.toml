[package]
name = "toql_mysql_async"
version = "0.4.3"
authors = ["Roy Ganz <roy.ganz@glanis.biz>"]
edition = "2018"
description = "MySQL Async for Toql"
keywords = ["toql", "mysql"]
readme = "README.md"
license = "MIT/Apache-2.0"
repository = "https://github.com/roy-ganz/toql"

[dependencies]
toql = { version ="^0.4.2", git="https://github.com/roy-ganz/toql" }
mysql_async = "0.29"
async-trait = "0.1"
tracing= "0.1"
thiserror = "1"
mysql_common = {version= "0.28", features=["chrono"]}
futures-core = "0.3"

[dev-dependencies]
tokio ={ version = "1", features = ["full"] }

[patch.crates-io]
funty = { git="https://github.com/ferrilab/funty", commit="7ef0d890fbcd8b3def1635ac1a877fc298488446"} # fix yanked funty version form crates.io 